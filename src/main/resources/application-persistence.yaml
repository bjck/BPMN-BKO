# Persistence profile: enables JPA storage beans (uses default PostgreSQL from application.properties)
# Activate with: spring.profiles.active=persistence

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bpmn}
    username: ${SPRING_DATASOURCE_USERNAME:bpmn}
    password: ${SPRING_DATASOURCE_PASSWORD:bpmn}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
    open-in-view: false
  sql:
    init:
      mode: never
