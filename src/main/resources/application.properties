spring.threads.virtual.enabled=true
# PostgreSQL (default). Ensure Docker container is running: docker compose -f docker/docker-compose.dev.yml up -d
spring.datasource.url=jdbc:postgresql://localhost:5432/bpmn
spring.datasource.username=bpmn
spring.datasource.password=bpmn
spring.datasource.driver-class-name=org.postgresql.Driver
# HikariCP: sized for high-throughput performance tests (10k+ concurrent processes)
spring.datasource.hikari.maximum-pool-size=200
spring.datasource.hikari.minimum-idle=50
spring.datasource.hikari.connection-timeout=30000
# Max concurrent process executions (backpressure to avoid exhausting connection pool)
bpmn.performance.max-concurrency=150
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Enable persistence storage by default (process state, history)
spring.profiles.include=persistence
