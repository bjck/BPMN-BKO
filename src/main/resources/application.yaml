spring:
  application:
    name: bpmn-engine
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  # Kafka bootstrap (used when bpmn.kafka.enabled=true). Override with SPRING_KAFKA_BOOTSTRAP_SERVERS.
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# BPMN message/signal throw and catch via Kafka (opt-in). Set BPMN_KAFKA_ENABLED=true in .env when using Kafka service tasks or BPMN events.
bpmn:
  kafka:
    enabled: ${BPMN_KAFKA_ENABLED:true}
    topic: ${BPMN_KAFKA_TOPIC:bpmn-events}
    consumer-group: ${BPMN_KAFKA_CONSUMER_GROUP:bpmn-engine}
    # Checkpoint-via-Kafka: engine publishes checkpoints to a separate topic; a consumer writes to DB (eventually consistent). Requires persistence profile and bpmn.kafka.enabled.
    checkpoint-topic: ${BPMN_KAFKA_CHECKPOINT_TOPIC:bpmn-checkpoints}
    checkpoint-enabled: ${BPMN_KAFKA_CHECKPOINT_ENABLED:true}
    checkpoint-consumer-group: ${BPMN_KAFKA_CHECKPOINT_CONSUMER_GROUP:bpmn-engine-checkpoint-consumer}

ai:
  gemini:
    api-key: ${GEMINI_API_KEY}
    model: ${GEMINI_MODEL:gemini-3.1-pro-preview}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    timeout: ${GEMINI_TIMEOUT:60s}
