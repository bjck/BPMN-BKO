<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 52" width="400" height="104" fill="none">

  <!-- THE MARK: B built from BPMN primitives -->
  <!-- Spine (sequence flow line / vertical stroke of B) -->
  <rect x="5" y="6" width="5" height="40" rx="2.5" fill="#0c0f14"/>

  <!-- Start event (filled circle = BPMN start) -->
  <circle cx="7.5" cy="6" r="3.5" fill="#0c0f14"/>

  <!-- Upper task box (top bump of B = BPMN task) -->
  <rect x="10" y="8" width="22" height="16" rx="4" fill="#0c0f14"/>
  <rect x="14" y="13" width="10" height="2" rx="1" fill="white" opacity="0.25"/>

  <!-- Bridge between bumps -->
  <rect x="5" y="24" width="5" height="2" rx="1" fill="#0c0f14"/>

  <!-- Lower task box (bottom bump of B = BPMN task, slightly wider) -->
  <rect x="10" y="27" width="28" height="18" rx="4" fill="#0c0f14"/>
  <rect x="14" y="35" width="14" height="2" rx="1" fill="white" opacity="0.25"/>

  <!-- End event (double ring = BPMN end) -->
  <circle cx="7.5" cy="46" r="3.5" fill="#0c0f14"/>
  <circle cx="7.5" cy="46" r="1.8" fill="white"/>

  <!-- Teal accent node -->
  <circle cx="36" cy="16" r="2.5" fill="#1cc8b2"/>

  <!-- WORDMARK -->
  <text x="52" y="36"
    font-family="'Sora', 'Helvetica Neue', Helvetica, sans-serif"
    font-size="30"
    font-weight="700"
    letter-spacing="-0.5"
    fill="#0c0f14">BPMN</text>

  <text x="53" y="48"
    font-family="'Sora', 'Helvetica Neue', Helvetica, sans-serif"
    font-size="9"
    font-weight="400"
    letter-spacing="2.2"
    fill="#8a9ab0">ENGINE · by bko</text>

</svg>
