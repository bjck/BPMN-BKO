<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BPMN Engine</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="https://unpkg.com/bpmn-js@18.6.1/dist/assets/diagram-js.css">
  <link rel="stylesheet" href="https://unpkg.com/bpmn-js@18.6.1/dist/assets/bpmn-js.css">
  <link rel="stylesheet" href="https://unpkg.com/bpmn-js@18.6.1/dist/assets/bpmn-font/css/bpmn-embedded.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <a class="header-logo" href="#/" aria-label="BPMN Engine home">
        <svg class="header-logo-mark" width="32" height="36" viewBox="0 0 46 52" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="5" y="6" width="5" height="40" rx="2.5" fill="currentColor"/>
          <circle cx="7.5" cy="6" r="3.5" fill="currentColor"/>
          <rect x="10" y="8" width="22" height="16" rx="4" fill="currentColor"/>
          <rect x="14" y="13" width="10" height="2" rx="1" fill="white" opacity="0.25"/>
          <rect x="5" y="24" width="5" height="2" rx="1" fill="currentColor"/>
          <rect x="10" y="27" width="28" height="18" rx="4" fill="currentColor"/>
          <rect x="14" y="35" width="14" height="2" rx="1" fill="white" opacity="0.25"/>
          <circle cx="7.5" cy="46" r="3.5" fill="currentColor"/>
          <circle cx="7.5" cy="46" r="1.8" fill="white"/>
          <circle cx="36" cy="16" r="2.5" fill="#1cc8b2"/>
        </svg>
        <span class="header-logo-wordmark">
          <span class="header-logo-primary">BPMN</span>
          <span class="header-logo-sub">Engine · by bko</span>
        </span>
      </a>
      <nav class="nav" role="navigation" aria-label="Main">
        <a class="nav-link" href="#/processes" data-route="processes">Deploy</a>
        <a class="nav-link" href="#/editor" data-route="editor">Editor</a>
        <a class="nav-link" href="#/instances" data-route="instances">Instances</a>
        <a class="nav-link" href="#/performance" data-route="performance">Performance</a>
      </nav>
    </header>

    <main id="main" class="main" role="main">
      <!-- Content rendered by SPA router -->
    </main>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
    <div id="ai-chat-root"></div>
  </div>
  <!-- bpmn.io bundles: keep modeler and viewer separated -->
  <script src="/js/bpmn-modeler.production.min.js"></script>
  <script>
    window.BpmnModeler = window.BpmnJS;
  </script>
  <script src="https://unpkg.com/bpmn-js@18.6.1/dist/bpmn-viewer.production.min.js"></script>
  <script>
    window.BpmnViewer = window.BpmnJS;
    window.BpmnJS = window.BpmnModeler;
  </script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
